services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    environment:
      POSTGRES_DB: convex_self_hosted
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans l'environnement de déploiement}
      POSTGRES_USER: convex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "convex", "-d", "convex_self_hosted"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_PORT:-3210}:3210"
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      APPLICATION_MAX_CONCURRENT_MUTATIONS: ${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      APPLICATION_MAX_CONCURRENT_NODE_ACTIONS: ${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      APPLICATION_MAX_CONCURRENT_QUERIES: ${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      APPLICATION_MAX_CONCURRENT_V8_ACTIONS: ${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://localhost:3211}
      DISABLE_BEACON: ${DISABLE_BEACON:-true}
      DISABLE_METRICS_ENDPOINT: ${DISABLE_METRICS_ENDPOINT:-true}
      DOCUMENT_RETENTION_DELAY: ${DOCUMENT_RETENTION_DELAY:-172800}
      INSTANCE_NAME: ${INSTANCE_NAME:-convex-self-hosted}
      POSTGRES_URL: postgresql://convex:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans l'environnement de déploiement}@postgres:5432
      DO_NOT_REQUIRE_SSL: "1"
      REDACT_LOGS_TO_CLIENT: ${REDACT_LOGS_TO_CLIENT:-true}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_DASHBOARD_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:-http://localhost:3211}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      CONVEX_INTERNAL_URL: http://backend:3210
      CONVEX_INTERNAL_SITE_URL: http://backend:3211
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  convex-data:
  postgres-data:
