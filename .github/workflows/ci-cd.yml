name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Vérifications
    runs-on: ubuntu-latest

    env:
      VITE_CONVEX_URL: https://convex.example.invalid
      VITE_CONVEX_SITE_URL: https://convex-site.example.invalid

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  deploy:
    name: Déploiement
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]

    concurrency:
      group: eau-roche-production
      cancel-in-progress: false

    steps:
      - name: Déployer les deux sites
        shell: bash
        run: |
          set -euo pipefail

          # Les paquets DSM ne sont pas tous dans le PATH du service systemd.
          export PATH="/var/packages/Git/target/bin:/usr/local/bin:/opt/bin:$PATH"

          command -v git >/dev/null
          command -v docker >/dev/null

          cd /volume1/docker/eau-roche

          git fetch origin main
          git checkout main
          git merge --ff-only "$GITHUB_SHA"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f docker-compose.yaml
          test -f .env
          test -f .env.site2

          docker ps >/dev/null

          dc() {
            local project="$1"
            local env_file="$2"
            shift 2

            docker compose \
              -f docker-compose.yaml \
              -p "$project" \
              --env-file "$env_file" \
              "$@"
          }

          wait_healthy() {
            local container_id="$1"
            local container_name="$2"
            local status=""

            for _ in {1..60}; do
              status="$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$container_id")"

              if [ "$status" = "healthy" ]; then
                return 0
              fi

              sleep 2
            done

            echo "$container_name n'est pas sain"
            docker logs --tail 100 "$container_id" || true
            return 1
          }

          deploy_convex() {
            local project="$1"
            local env_file="$2"
            local modules_volume="${project}-node-modules"
            local store_volume="${project}-pnpm-store"
            local backend_id=""
            local network=""

            dc "$project" "$env_file" up -d postgres backend

            backend_id="$(dc "$project" "$env_file" ps -q backend)"
            test -n "$backend_id"

            wait_healthy "$backend_id" "${project}-backend"

            network="$(docker inspect "$backend_id" \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
              | head -n 1)"

            test -n "$network"

            docker run --rm \
              --network "$network" \
              --env-file "$env_file" \
              -e CONVEX_SELF_HOSTED_URL=http://backend:3210 \
              -v "$PWD:/app" \
              -v "$modules_volume:/app/node_modules" \
              -v "$store_volume:/pnpm/store" \
              -w /app \
              node:22-alpine \
              sh -lc '
                corepack enable &&
                pnpm install --frozen-lockfile --store-dir /pnpm/store &&
                pnpm exec convex deploy --codegen disable
              '
          }

          deploy_web() {
            local project="$1"
            local env_file="$2"
            local web_id=""

            dc "$project" "$env_file" up -d \
              --no-deps \
              --force-recreate \
              web

            web_id="$(dc "$project" "$env_file" ps -q web)"
            test -n "$web_id"

            wait_healthy "$web_id" "${project}-web"
          }

          # Construire les deux images avant de modifier les backends.
          dc eau-roche .env build web
          dc fiole-voyageur .env.site2 build web

          # Mettre à jour les fonctions avant les frontends qui les utilisent.
          deploy_convex eau-roche .env
          deploy_convex fiole-voyageur .env.site2

          deploy_web eau-roche .env
          deploy_web fiole-voyageur .env.site2
